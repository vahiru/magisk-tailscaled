# Magisk Tailscaled user settings.
# This file lives at /data/adb/tailscale/settings.conf and is kept across module updates.
# Apply changes with: su -c 'tailscaled.service restart'

# Extra arguments passed to tailscaled.
# Example for kernel TUN mode (needs /dev/tun support in your kernel):
#   TS_DAEMON_ARGS="-no-logs-no-support -tun=tailscale0"
TS_DAEMON_ARGS="-no-logs-no-support"

# Start tailscaled automatically on boot (1 = yes, 0 = no).
TS_AUTOSTART=1

# Seconds to wait for a graceful shutdown before sending SIGKILL.
TS_STOP_TIMEOUT=10

# Trim tailscaled / service logs once they grow past this size (KiB).
TS_LOG_MAX_KB=2048
